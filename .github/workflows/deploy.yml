name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Fail the job on the first error. Without this, a failing `git pull`
          # used to be swallowed and the job still reported success.
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.WORK_DIR }}
            git fetch --quiet origin
            git merge --ff-only origin/main
            SELF_UPDATE_SYNC_RESTART=1 bash scripts/self-update.sh deploy
