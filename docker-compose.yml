services:
  waha:
    image: devlikeapro/waha:noweb-arm
    container_name: john-mustard-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_BASE_URL=http://waha:3000
      - WHATSAPP_HOOK_URL=http://bot:4500/webhook
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
    volumes:
      - ./waha_sessions:/app/.sessions
    networks:
      - bot-net

  9router:
    image: decolua/9router:latest
    container_name: john-mustard-9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./9router-data:/app/data
      - ./9router-data/route.js:/app/.next/server/app/api/v1beta/models/[...path]/route.js:ro
    networks:
      - bot-net

  hermes-tunnel:
    build: ./tunnel
    container_name: john-mustard-hermes-tunnel
    restart: unless-stopped
    # Local-dev only: exposes the VPS Hermes gateway on this host's 127.0.0.1:8642.
    # On the VPS, Hermes runs on the same host so no tunnel is needed.
    profiles: ["local"]
    environment:
      - SSH_HOST=${HERMES_SSH_HOST:-168.110.213.231}
      - SSH_USER=${HERMES_SSH_USER:-ubuntu}
      - SSH_KEY_PATH=/key/ssh-key-2026-08-26.key
      - LOCAL_PORT=8642
      - REMOTE_HOST=127.0.0.1
      - REMOTE_PORT=8642
    volumes:
      - ./key-oracle:/key:ro
    ports:
      - "127.0.0.1:8642:8642"
    networks:
      - bot-net

  bot:
    build: .
    container_name: john-mustard-bot
    restart: unless-stopped
    depends_on:
      - waha
      - runner
      - 9router
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4500:4500"
    environment:
      - PORT=4500
      - WAHA_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - DB_PATH=/app/data/bot.db
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PYTHON_RUNNER_URL=http://runner:8000/run
      - HERMES_API_URL=${HERMES_API_URL:-http://host.docker.internal:8642/v1}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - HERMES_TIMEOUT_MS=${HERMES_TIMEOUT_MS:-120000}
      - NINEROUTER_URL=${NINEROUTER_URL:-http://john-mustard-9router:20128}
      - NINEROUTER_KEY=${NINEROUTER_KEY}
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./config:/app/config:ro
      - ./system-prompt.md:/app/system-prompt.md:ro
      - ./data:/app/data
      - ./vault:/app/vault
      - ./skills:/app/skills
      - ./waha_sessions:/app/waha_sessions:ro
    networks:
      - bot-net

  runner:
    build: ./runner
    container_name: john-mustard-runner
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    volumes:
      - ./vault:/app/vault
    networks:
      - bot-net

  scheduler:
    build: ./scheduler
    container_name: john-mustard-scheduler
    restart: unless-stopped
    depends_on:
      - bot
    networks:
      - bot-net

networks:
  bot-net:
    driver: bridge
